<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="준호와 채빈에게 축하 메모를 전하는 화면">
  <title>junho.chaebeen · 메시지</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./feed.css">
  <link rel="stylesheet" href="./message-page.css">
</head>
<body class="message-page-body">
  <main class="message-dialog message-page-shell">
    <div class="message-shell">
      <header class="message-header">
        <button class="message-header__back" type="button" id="messageBackButton" aria-label="이전 화면으로 돌아가기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="message-header__account">
          <span class="message-header__avatar">
            <img src="./images/KakaoTalk_20261025_205325815.jpg" alt="">
          </span>
          <span>
            <strong>junho.chaebeen</strong>
            <small>비즈니스 채팅</small>
          </span>
        </div>
        <div class="message-header__actions">
          <button type="button" id="messageCallButton" aria-label="통화하기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 3.8 5.1 5.3c-1.5.7-2.1 2.5-1.4 4C6.5 16 10 19.5 16.7 22.3c1.5.6 3.3 0 4-1.4l1.5-3.3-5-2.5-1.8 1.8a12.4 12.4 0 0 1-6.3-6.3l1.8-1.8-2.5-5Z"/></svg>
          </button>
          <button type="button" id="messageVideoButton" aria-label="영상 통화하기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="5.4" width="12.6" height="13.2" rx="4"/><path d="m15.4 10 5.8-3.2v10.4L15.4 14"/></svg>
          </button>
        </div>
      </header>

      <section class="message-content" aria-label="메시지 내용">
        <div class="message-content__buttons">
          <button type="button" id="messageInquiryButton">문의</button>
          <button type="button" id="messageProfileButton">프로필 보기</button>
        </div>

        <div class="message-intro">
          <span class="message-intro__avatar">
            <img src="./images/KakaoTalk_20261025_205325815.jpg" alt="준호와 채빈의 프로필 사진">
          </span>
          <h2>junho.chaebeen</h2>
          <p><b>327</b> 팔로워 · <b>11</b> 게시물</p>
          <p class="message-intro__since">2026년부터 이 Instagram 계정을 팔로우하고 있습니다</p>
          <p class="message-intro__notice">junho.chaebeen님과 채팅을 시작했습니다. 전달해 주신 메모는 이 기기에 안전하게 저장됩니다.</p>
          <div class="message-memos" id="messageMemos" aria-live="polite"></div>
        </div>
      </section>

      <form class="message-composer" id="messageForm">
        <button class="message-composer__camera" type="button" id="memoCameraButton" aria-label="사진 보내기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="5"/><circle cx="12" cy="13" r="4"/><path d="M8 5.2 9.5 3h5L16 5.2"/></svg>
        </button>
        <label class="sr-only" for="memoInput">축하 메모</label>
        <div class="message-composer__field">
          <input id="memoInput" name="memo" type="text" maxlength="180" placeholder="메시지 보내기..." autocomplete="off" required>
          <button type="button" id="memoVoiceButton" aria-label="음성 메시지">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>
          </button>
          <button type="button" id="memoImageButton" aria-label="이미지 추가">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="8.2" cy="9" r="1.4"/><path d="m5.5 17 4.6-4.8 3.1 3 2.2-2.4 3.4 4.2"/></svg>
          </button>
          <button type="button" id="memoStickerButton" aria-label="스티커 추가">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 12a8.8 8.8 0 1 1-8.8-8.8h5.7V9a3 3 0 0 0 3 3h.1Z"/><circle cx="8.4" cy="10" r=".8" fill="currentColor" stroke="none"/><path d="M8 14c1.5 1.2 2.7 1.2 4 0"/></svg>
          </button>
          <button class="message-composer__send" type="submit" aria-label="메모 보내기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 2.2 2.7 9.1c-.8.3-.8 1.4 0 1.7l7.4 2.7 2.7 7.4c.3.8 1.4.8 1.7 0l6.9-19.1c.1-.5-.3-.8-.6-.7Z"/><path d="m10.1 13.6 4.2-4.2"/></svg>
          </button>
        </div>
        <button class="message-composer__plus" type="button" id="memoPlusButton" aria-label="추가 기능">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
        </button>
      </form>
    </div>
  </main>

  <div class="toast" id="messageToast" role="status" aria-live="polite"></div>
  <script src="./message.js"></script>
</body>
</html>
