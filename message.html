<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="준호와 채빈에게 축하 메모를 전하는 화면">
  <title>junho.chaebeen · 메시지</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./feed.css">
  <link rel="stylesheet" href="./message-page.css">
</head>
<body class="message-page-body">
  <main class="message-dialog message-page-shell">
    <div class="message-shell">
      <header class="message-header">
        <button class="message-header__back" type="button" id="messageBackButton" aria-label="이전 화면으로 돌아가기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="message-header__account">
          <span class="message-header__avatar">
            <img src="./images/slide_2%202.JPG" alt="">
          </span>
          <span>
            <strong>junho.chaebeen</strong>
            <small>축하 메시지</small>
          </span>
        </div>
        <span class="message-header__spacer" aria-hidden="true"></span>
      </header>

      <section class="message-content" aria-label="메시지 내용">
        <div class="message-intro">
          <span class="message-intro__avatar">
            <img src="./images/slide_2%202.JPG" alt="준호와 채빈의 프로필 사진">
          </span>
          <h2>junho.chaebeen</h2>
          <p>손준호 <b>·</b> 남채빈</p>
          <p class="message-intro__since">2027년 3월 27일 · 더에스비 웨딩홀</p>
          <p class="message-intro__notice">두 사람에게 전할 축하 메시지를 남겨주세요. 작성한 내용은 현재 사용 중인 브라우저에 저장됩니다.</p>
          <div class="message-memos" id="messageMemos" aria-live="polite"></div>
        </div>
      </section>

      <form class="message-composer" id="messageForm">
        <label class="sr-only" for="memoName">보내는 사람 이름</label>
        <input class="message-composer__name" id="memoName" name="name" type="text" maxlength="20" placeholder="이름을 남겨주세요" autocomplete="name">
        <label class="sr-only" for="memoInput">축하 메모</label>
        <div class="message-composer__field">
          <input id="memoInput" name="memo" type="text" maxlength="180" placeholder="메시지 보내기..." autocomplete="off" required>
          <button class="message-composer__send" type="submit" aria-label="메모 보내기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-linejoin="round" stroke-linecap="round" d="M21.2 2.3c.6-.2 1.1.3.9.9l-6 17.2c-.2.6-1 .7-1.4.1l-3.3-6-6-3.3c-.6-.4-.5-1.2.1-1.4L21.2 2.3Z"/><path stroke-linecap="round" d="m10.4 14.2 10.9-11.2"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div class="toast" id="messageToast" role="status" aria-live="polite"></div>
  <script src="./message.js"></script>
</body>
</html>
